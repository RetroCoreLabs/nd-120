# Builds the docs site (https://retrocorelabs.github.io/nd-120/) with MkDocs
# and the Material theme, and publishes it on GitHub Pages.
#
# The SITE only: no synthesis, no bitstreams, no simulation. The module pages,
# the schematics, HIERARCHY.md and the page tree (docs-site/nav.yml) are made
# locally by Verilog/tests/gen_module_docs.py and committed; this job only
# turns the committed Markdown into HTML.
#
# The file keeps its old name (it used to run Jekyll) so the Pages settings
# and the run history that point at it stay as they are.
name: Docs site (MkDocs) on GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # no submodules: the MEGA65 framework (Verilog/fpga/mega65/m2m) is
        # not part of the site (docs-site/mkdocs.yml exclude_docs)
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MkDocs (pinned versions)
        run: pip install -r docs-site/requirements.txt
      - name: Build the site
        # --strict: a broken link fails the build instead of publishing it.
        # MkDocs will not write the site inside its docs folder, and the docs
        # folder is the whole repository, so the output goes next to it.
        run: mkdocs build --strict -f docs-site/mkdocs.yml -d "${{ runner.temp }}/site"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
