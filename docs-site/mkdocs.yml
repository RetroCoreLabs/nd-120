# The docs site: https://retrocorelabs.github.io/nd-120/
#
# Built by MkDocs with the Material theme from the Markdown that sits all over
# the repository - nothing is copied into a docs/ folder. Build it with
#     mkdocs build --strict -f docs-site/mkdocs.yml -d <a folder outside the repo>
# (CONTRIBUTING.md, "The module docs and the docs site", has the whole local
# recipe).
#
# The left-hand page tree is NOT kept here: it is generated into nav.yml by
# Verilog/tests/gen_site_nav.py (run by Verilog/tests/gen_module_docs.py) and
# read below with INHERIT, so it always matches the files in the tree.
INHERIT: nav.yml

site_name: ND-120 CPU
site_description: >-
  The 1988 Norsk Data ND-120 CPU rebuilt in Verilog from the original design
  documents - runs SINTRAN III on FPGA boards.
site_url: https://retrocorelabs.github.io/nd-120/
# Keep the page addresses the Jekyll site had (Verilog/HIERARCHY.html, a
# folder's README as its index.html), so every address already given out
# keeps working - including the forwarding page on the old ronnya.github.io
# site, which maps each old path onto the same path here.
use_directory_urls: false
repo_url: https://github.com/RetroCoreLabs/nd-120
repo_name: RetroCoreLabs/nd-120
edit_uri: blob/main/

# The whole repository is the docs source. MkDocs refuses a docs_dir that is
# the folder holding this file, which is why this file sits in docs-site/ and
# points one level up.
docs_dir: ..
# MkDocs also refuses a site_dir inside docs_dir, so the default output goes
# NEXT TO the checkout. Every build passes -d anyway (the workflow and the
# local recipe both do).
site_dir: ../../nd-120-site

# Not part of the site (gitignore syntax, relative to the repository top).
# Dot-folders (.github, .git, .claude) are left out by MkDocs itself.
exclude_docs: |
  # other people's code: the MEGA65 framework submodule, the MiSTer framework
  /Verilog/fpga/mega65/m2m/
  /Verilog/fpga/mister/sys/
  # vendor IP generated by Xilinx MIG
  /Verilog/fpga/nexys4ddr/ddr2-test/ip/
  # an A4 print sheet (March 2026) that has the same name as the current
  # basys3-debug-reference.md; with .html page addresses the two would be the
  # same page. The .md is the one kept up to date; the print sheet stays
  # published as basys3-debug-reference.pdf next to it.
  /Verilog/doc/basys3-debug-reference.html
  # build output, tool scratch and logs
  node_modules/
  obj_dir*/
  build/
  /tmp/
  *.log
  *.jou
  __pycache__/
  # the site's own build files (extra.css stays - the pages use it)
  /docs-site/*.yml
  /docs-site/*.py
  /docs-site/*.txt
  # the old Jekyll settings and the machine-local settings
  /_config.yml
  /local.mk

theme:
  name: material
  language: en
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  palette:
    # follows the reader's system setting, with a switch in the header
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system setting
  features:
    - navigation.indexes      # a section can have its own page
    - navigation.path         # where-am-I line above the title
    - navigation.top          # back-to-top button
    - navigation.prune        # each page carries only the open part of the
                              # tree; with ~400 module pages in it, the whole
                              # tree on every page would make every page big
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow              # the "on this page" bar follows the reader
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      # heading anchors the GitHub way ("## 🎯 Overview" -> #-overview), so
      # the same links work on github.com and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html                # Markdown inside <details markdown="1"> (the
                              # Verilog source block on every module page)
  - admonition
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # The pages are written for GitHub, where a nested list is indented by two
  # spaces. Plain Python-Markdown wants four and would flatten every nested
  # list in the repository; this extension reads them the GitHub way.
  - mdx_truly_sane_lists:
      nested_indent: 2

extra_css:
  - docs-site/extra.css

# Raw-HTML links (the HIERARCHY tree, the links inside the schematic SVGs)
# point at .md files so they work on github.com; the hook turns them into
# page links on the site and warns - so --strict fails - when one is broken.
hooks:
  - hooks.py

validation:
  nav:
    omitted_files: info       # most pages are reached by links, not the tree
  links:
    not_found: warn           # a broken link fails the --strict build
    absolute_links: info
    unrecognized_links: info  # links to folders: hooks.py points them at the
                              # folder's README page or the folder on GitHub
    anchors: info
